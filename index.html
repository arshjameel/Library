<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Library</h1>
            <div class="add-button-container">
                <button class="addBookBtn btnDisplayForm">Add a Book</button>            
            </div> 
        </div>
        <dialog class="dialog">
            <form action="" method="post">
                <p class="form-row">
                    <label for="title">Title</label>
                    <input id="title"
                        name="title"
                        type="text" 
                        required 
                    />
                </p>
                <p class="form-row">
                    <label for="author">Author</label>
                    <input id="author"
                        name="author"
                        type="text" 
                        required 
                    />
                </p>
                <p class="form-row">
                    <label for="pages">Pages</label>
                    <input id="pages"
                        name="pages"
                        type="number"
                        min="1" 
                        required 
                    />
                </p>
                <p class="read-row"> 
                    <label for="read">Read: </label>
                    <input id="read-status"
                        name="read"
                        type="checkbox"
                        value="true" 
                        checked
                    /> 
                </p>
                <div class="button-row">
                    <div class="add-button-container">
                        <button class="addBookBtn" type="submit">Add Book</button>
                    </div>
                </div>
            </form>
        </dialog>
        <div class="contentBox">
        </div>
        <div class="footer">
            <p>&copy <script>document.write(new Date().getFullYear());</script> Arsh Jameel</p>
        </div>
    </div>
</body>
</html>
